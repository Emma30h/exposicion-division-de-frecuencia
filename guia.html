<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guía · División de Frecuencia</title>
<meta name="theme-color" content="#0a1219">
<link rel="icon" href="media/logo_ojo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Guía de bolsillo: misma identidad que la presentación, una tarjeta simple por lámina */
:root{color-scheme:dark;
  --bg:#0a1219;--panel:#101c26;--panel-2:#152330;--line:#22343f;--fg:#e8eef2;--muted:#93a6b4;--faint:#5f7484;
  --brand:#42ade8;--brand-soft:rgba(66,173,232,.14);--signal:#e2a23b;--signal-soft:rgba(226,162,59,.14);--ok:#34c77b;
  --f1:#3276c7;--f2:#79a8de;--f3:#ac7505;--f4:#cfa952;--f5:#b74873;--f6:#d087a6;--f7:#1c9144;--f8:#8564c3;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-body:"Barlow","Segoe UI",Arial,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:620px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,rgba(10,18,25,0));padding:14px 0 16px;display:flex;align-items:center;gap:12px}
header img{width:46px;height:auto}
header .t{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.05;text-transform:uppercase}
header .t span{color:var(--brand)}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 10px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.live i{background:var(--ok);animation:pulse 1.8s infinite}
.status.live{color:var(--fg)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,123,.6)}100%{box-shadow:0 0 0 10px rgba(52,199,123,0)}}

/* tarjeta y transición entre láminas */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 18px 22px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.card.anim.fwd{animation:inR .5s var(--ease) both}
.card.anim.bwd{animation:inL .5s var(--ease) both}
@keyframes inR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.card.anim [data-a]{animation:rise .6s var(--ease) backwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{transform:none}}
.num{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);display:flex;justify-content:space-between;align-items:center}
.num b{color:var(--muted);font-weight:400}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:-8px}
.prog i{display:block;height:100%;background:var(--brand);width:var(--p);transition:width .6s var(--ease)}
.kick{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);margin-bottom:-8px}
h1{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1.02;margin:0;text-wrap:balance}
h1 .wd{display:inline-block}
.card.anim h1 .wd{animation:word .6s var(--ease) both;animation-delay:calc(var(--w) * 70ms + 120ms)}
@keyframes word{from{opacity:0;transform:translateY(.45em);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul li{font-size:17px;line-height:1.45;padding-left:18px;position:relative;color:var(--muted)}
ul li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
li b{font-weight:600;color:var(--fg)}

/* pasos numerados: el que se explica en pantalla se resalta */
ol{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:10px}
ol li{position:relative;font-size:17.5px;line-height:1.42;padding:12px 14px 12px 54px;background:var(--panel-2);border:1px solid transparent;border-radius:10px;color:var(--muted);transition:border-color .35s,background .35s,opacity .35s,transform .35s var(--ease)}
ol li::before{counter-increment:p;content:counter(p);position:absolute;left:12px;top:11px;width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-family:var(--f-mono);font-size:13px;display:grid;place-items:center;transition:background .35s,color .35s}
ol li b{color:var(--fg)}
ol.live li{opacity:.45}
ol.live li.done{opacity:.7}
ol.live li.done::before{content:"✓";background:rgba(52,199,123,.18);color:var(--ok)}
ol.live li.cur{opacity:1;border-color:rgba(226,162,59,.6);background:linear-gradient(0deg,var(--signal-soft),var(--signal-soft)),var(--panel-2);transform:scale(1.02)}
ol.live li.cur::before{background:var(--signal);color:#0a1219}

/* frecuencias: el número de la lista es el color de la frecuencia */
ol.fq li{padding-left:16px}
ol.fq li::before{display:none}
.fq .reg{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.fq .f{display:flex;align-items:center;gap:10px;font-size:16.5px;color:var(--fg)}
.fq .f+.f{margin-top:6px}
.fq .f i{width:14px;height:14px;border-radius:3px;flex:none}
.fq .f b{font-family:var(--f-display);font-size:20px;min-width:74px}
.fq .f span{color:var(--muted)}

.tip{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.45;color:var(--muted);padding:12px 14px;border-left:3px solid var(--signal);background:var(--panel-2);border-radius:0 8px 8px 0}
.tip.ok{border-left-color:var(--ok)}
.tip .ic{color:var(--signal);margin-top:1px}
.tip.ok .ic{color:var(--ok)}
.tip b{color:var(--fg);font-weight:600}

/* tres datos */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:var(--panel-2);border-radius:10px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.trio b{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;color:var(--brand)}
.trio small{font-size:13px;color:var(--muted);line-height:1.3}

/* línea de pasos (recorrido) */
.steps{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:46px}
.steps::before{content:"";position:absolute;left:16px;top:16px;bottom:16px;width:2px;background:var(--line)}
.stp{position:relative;padding:4px 0}
.stp .dot{position:absolute;left:-46px;top:0;width:34px;height:34px;border-radius:50%;background:var(--bg);color:var(--brand);border:1.5px solid var(--brand);display:grid;place-items:center}
.stp.end .dot{color:var(--signal);border-color:var(--signal)}
.stp .dot .ic{width:17px;height:17px}
.stp small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand)}
.stp.end small{color:var(--signal)}
.stp p{margin:2px 0 0;font-size:16.5px;line-height:1.38}

/* chat: el saludo no cuenta, la situación sí */
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 13px;border-radius:12px 12px 12px 3px;background:var(--panel-2);font-size:16px;line-height:1.4;position:relative;color:var(--muted)}
.bub em{display:block;font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:5px;color:var(--faint)}
.bub.go{border:1px solid var(--signal);background:var(--signal-soft);color:var(--fg)}
.bub.go em{color:var(--signal)}

/* portada y gracias: radar */
.hero{display:grid;place-items:center;padding:18px 0 6px}
.radar{position:relative;width:150px;height:150px;display:grid;place-items:center}
.radar img{width:96px;position:relative;z-index:1}
.card.anim .radar img{animation:popIn .8s cubic-bezier(.2,.8,.3,1.25) both;animation-delay:.15s}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);opacity:0;animation:ring 3s ease-out infinite}
.radar i:nth-child(2){animation-delay:1s}.radar i:nth-child(3){animation-delay:2s}
@keyframes ring{0%{transform:scale(.45);opacity:.7}100%{transform:scale(1.25);opacity:0}}
@keyframes popIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.big{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.88;text-transform:uppercase;text-align:center}
.big span{color:var(--brand)}
.dir{text-align:center;font-family:var(--f-display);font-weight:600;font-size:22px;text-transform:uppercase;line-height:1.1}
.dir small{display:block;color:var(--muted);font-size:16px;letter-spacing:.06em;font-weight:600}
.pol{text-align:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.descarga{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid rgba(66,173,232,.55);background:var(--brand-soft);color:var(--fg);text-decoration:none}
.descarga:active{background:rgba(66,173,232,.26)}
.descarga .ic2{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#04121c;display:grid;place-items:center;flex:none}
.descarga .ic2 svg{width:21px;height:21px}
.descarga b{display:block;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.05}
.descarga small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* navegación */
.back{all:unset;display:none;margin:14px auto 0;width:max-content;font-size:14px;color:#0a1219;background:var(--signal);border-radius:99px;padding:9px 16px;font-weight:600;cursor:pointer}
.back.show{display:block}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(10,18,25,0),var(--bg) 30%)}
.bar button{all:unset;width:52px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:20px;cursor:pointer}
.bar button:active{background:var(--panel-2)}
.pos{font-family:var(--f-mono);font-size:14px;color:var(--muted);min-width:64px;text-align:center}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
summary{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;padding:6px 0}
.idx{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.idx button{all:unset;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:9px 8px;border-radius:8px;font-size:15px;color:var(--muted);cursor:pointer}
.idx button span{font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-top:2px}
.idx button.cur{background:var(--panel);color:var(--fg)}
.idx button.cur span{color:var(--brand)}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--brand);color:#04121c;font:600 14px var(--f-body);padding:8px 14px;border-radius:99px;opacity:0;transition:opacity .3s,transform .3s;z-index:7;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <img src="media/logo_ojo.png" alt="">
  <div class="t">División de<br><span>Frecuencia</span></div>
  <div class="status" id="status"><i></i><span id="statusTxt">Conectando…</span></div>
</header>

<main id="main"></main>
<button class="back" id="back">Volver a la lámina en pantalla</button>

<details>
  <summary>Todas las láminas</summary>
  <div class="idx" id="idx"></div>
</details>

<nav class="bar">
  <button id="prev" aria-label="Lámina anterior">←</button>
  <span class="pos" id="pos" aria-live="polite">1 / 11</span>
  <button id="next" aria-label="Lámina siguiente">→</button>
</nav>
<div class="toast" id="toast">Lámina siguiente</div>

<script src="config-vivo.js"></script>
<script src="vendor/supabase.js"></script>
<script>
/* íconos (mismo trazo que la presentación) */
const P={
 msg:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 10h6M9 13.5h4"/>',
 sae:'<rect x="3" y="4" width="18" height="13" rx="1.5"/><path d="M8 21h8M12 17v4M7 9h6M7 12h10"/>',
 radio:'<rect x="7" y="6" width="10" height="16" rx="2"/><path d="M10 6V2M10 11h4M10 14h4"/><path d="M19 5a6 6 0 0 1 0 8"/>',
 user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-1a7 7 0 0 1 14 0v1"/>',
 car:'<path d="M3 16V11l2-5h11l3 5h2v5"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6M5 11h14"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
 ok:'<path d="M20 6 9 17l-5-5"/>'
};
const I=(k,c='ic')=>`<svg class="${c}" viewBox="0 0 24 24" aria-hidden="true">${P[k]}</svg>`;
const radar='<div class="hero" data-a><div class="radar"><i></i><i></i><i></i><img src="media/logo_ojo.png" alt="Logo Cordobeses en Alerta"></div></div>';
const PDF='Division de Frecuencia - Cordobeses en Alerta.pdf';
const fr=(c,n,u)=>`<span class="f"><i style="background:var(${c})"></i><b>${n}</b><span>UT ${u}</span></span>`;

/* una tarjeta por lámina, con el mismo id que la presentación.
   o: pasos que se resaltan a medida que el expositor avanza (off: en qué paso de la lámina empieza el primero) */
const L=[
 {id:'portada',t:'División de Frecuencia',pre:radar,b:['Cómo se reparte la ciudad en <b>8 frecuencias</b>.','Qué hace el <b>operador de cabina</b> y qué hace el <b>radio operador</b>.','Cuánto tiempo tiene cada parte.','Esta guía avanza sola junto con la exposición.']},
 {id:'frecuencias',k:'División de frecuencia',t:'La frecuencia la define la UT',cls:'fq',off:2,o:[
   `<span class="reg">Norte</span>${fr('--f1','Norte 1','15')}${fr('--f2','Norte 2','14 · 23 · 24 bis')}`,
   `<span class="reg">Este</span>${fr('--f3','Este 1','7 · 9 · 13 · 17')}${fr('--f4','Este 2','6 · 8')}`,
   `<span class="reg">Sur</span>${fr('--f5','Sur 1','5 · 12 · 21')}${fr('--f6','Sur 2','4 · 11')}`,
   `<span class="reg">Centro</span>${fr('--f7','Centro','2 · 3')}`,
   `<span class="reg">Oeste</span>${fr('--f8','Oeste','10 · 19 · 20 · 22')}`],
   tip:'En el SAE WEB la UT figura en <b>Comuna</b> como «DISTRITO».'},
 {id:'por-que',t:'Por qué medimos',x:()=>`<div class="trio" data-a><div><b>1'</b><small>operador de cabina</small></div><div><b>1–3'</b><small>hasta asignar el móvil</small></div><div><b>8</b><small>frecuencias</small></div></div>`,b:['Cada hecho deja su recorrido en el <b>SAE WEB</b>, con hora en cada paso.','Se va a medir <b>cuánto tarda en comisionarse</b> cada hecho.']},
 {id:'ruggear',k:'RugGear',t:'Cada frecuencia es un canal',o:['Los canales llevan la frecuencia y sus UT: <b>NORTE 1 - UT 15</b>.','Se elige el canal de la UT del hecho.','Otra UT, otro canal: <b>UT 14 → NORTE 2</b>. Se irradia con <b>Presione para hablar</b>.']},
 {id:'recorrido',t:'Del mensaje al móvil',x:()=>`<div class="steps" data-a>${[['msg','Vecino','Explica su situación'],['sae','Cabina','Crea la carta en el SAE WEB'],['radio','Cabina','Irradia a la frecuencia'],['user','Radio','Despacha y asigna el móvil'],['car','Calle','El móvil arriba']].map(([ic,a,t],i)=>`<div class="stp${i===4?' end':''}"><span class="dot">${I(ic)}</span><small>${a}</small><p>${t}</p></div>`).join('')}</div>`},
 {id:'cabina',k:'Funciones',t:'Operador de cabina',o:['<b>Ingresa</b> la alerta e interpreta el hecho.','<b>Crea la carta</b>: teléfono y calle; el sistema completa el resto.','<b>Mira la UT</b> en el campo Comuna.','<b>Irradia</b> por RugGear a la frecuencia de esa UT.'],tip:'Un cuadrante puede tener varias frecuencias: <b>manda la UT</b>.'},
 {id:'sae-norte1',k:'Así se carga',t:'UT 15 → NORTE 1',o:['Teléfono.','Calle y altura: el sistema geolocaliza solo.','Comuna muestra la UT: <b>DISTRITO 15</b>.','Relato; tipo y subtipo desde el desplegable.','Se irradia a <b>NORTE 1</b>.']},
 {id:'sae-norte2',k:'Así se carga',t:'UT 14 → NORTE 2',o:['Teléfono.','Calle y altura: el sistema geolocaliza solo.','Comuna muestra la UT: <b>DISTRITO 14</b>.','Relato; tipo y subtipo desde el desplegable.','Se irradia a <b>NORTE 2</b>.'],tip:'Una frecuencia puede abarcar <b>varias UT</b>.'},
 {id:'radio',k:'Funciones',t:'Radio operador',o:['Trabaja <b>su frecuencia</b>.','<b>Recibe la carta</b> irradiada.','<b>Despacha y asigna</b> el móvil.','<b>Deja constancia</b> y eleva la asignación.']},
 {id:'tiempos',k:'Tiempos',t:'¿Cuándo empieza a correr?',x:()=>`<div class="chat" data-a><div class="bub">Hola, buenas tardes.<em>No cuenta</em></div><div class="bub go">Hay un señor mayor desorientado en la esquina…<em>Arranca el tiempo</em></div></div>`,o:['El saludo <b>no cuenta</b>.','El tiempo corre desde que el vecino <b>explica su situación</b>.','<b>1 minuto</b> la cabina · <b>1 a 3 minutos</b> hasta el móvil asignado.']},
 {id:'gracias',t:'¡Muchas gracias!',hide:true,pre:radar,x:()=>`<div class="big" data-a>¡Muchas<br><span>gracias!</span></div><div class="dir" data-a><small>Dirección Monitoreo</small>Cordobeses en Alerta</div><div class="pol" data-a>Policía de la Provincia de Córdoba · Ministerio de Seguridad</div><a class="descarga" data-a href="${encodeURI(PDF)}" download="${PDF}"><span class="ic2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></span><span><b>Descargar el material</b><small>PDF · para guardar o compartir</small></span></a>`}
];
const VER='2026-11-03b';   // misma versión que index.html
const N=L.length, main=document.getElementById('main'), idx=document.getElementById('idx');
let cur=0, dir=1, live=null, liveF=0, follow=true;
idx.innerHTML=L.map((x,i)=>`<button><span>${String(i+1).padStart(2,'0')}</span>${x.t}</button>`).join('');
[...idx.children].forEach((b,i)=>b.onclick=()=>{go(i,true);document.querySelector('details').open=false});

function words(t){let w=0;return t.split(' ').map(s=>`<span class="wd" style="--w:${w++}">${s}</span>`).join(' ')}
function render(anim){
  const x=L[cur];
  let h=`<article class="card${anim?' anim '+(dir<0?'bwd':'fwd'):''}"><div class="num">Lámina ${cur+1}<b>de ${N}</b></div><div class="prog"><i style="--p:${((cur+1)/N*100).toFixed(1)}%"></i></div>`;
  if(x.pre) h+=x.pre;
  if(x.k) h+=`<div class="kick" data-a>${x.k}</div>`;
  if(!x.hide) h+=`<h1 aria-label="${x.t}">${words(x.t)}</h1>`;
  if(x.x) h+=x.x();
  if(x.o) h+=`<ol${x.cls?` class="${x.cls}"`:''}>${x.o.map(s=>`<li data-a>${s}</li>`).join('')}</ol>`;
  if(x.b) h+=`<ul>${x.b.map(s=>`<li data-a>${s}</li>`).join('')}</ul>`;
  if(x.tip) h+=`<div class="tip${x.ok?' ok':''}" data-a>${I(x.ok?'ok':'info')}<span>${x.tip}</span></div>`;
  main.innerHTML=h+'</article>';
  const card=main.firstChild, base=.32+x.t.split(' ').length*.05;
  card.querySelectorAll('[data-a]').forEach((e,i)=>e.style.setProperty('--d',(base+i*.1).toFixed(2)+'s'));
  marcar(); ui();
}
// resalta el paso que el expositor está mostrando (solo si seguimos la lámina en pantalla)
let anim0=-1;
function marcar(){
  const x=L[cur], on=live===cur && follow && liveF>0, card=main.firstChild; if(!card) return;
  const ol=card.querySelector('ol'); if(!ol) return;
  const k=liveF-(x.off||1);   // índice del paso actual en la lista
  ol.classList.toggle('live',on);
  [...ol.children].forEach((li,i)=>{ li.classList.toggle('done',on&&i<k); li.classList.toggle('cur',on&&i===k); });
  const c=on&&card.querySelector('li.cur'); if(c && anim0!==liveF){ anim0=liveF; c.scrollIntoView({block:'nearest',behavior:'smooth'}); }
}
function ui(){
  document.getElementById('pos').textContent=`${cur+1} / ${N}`;
  [...idx.children].forEach((b,i)=>b.classList.toggle('cur',i===cur));
  document.getElementById('back').classList.toggle('show', live!==null && !follow && live!==cur);
  try{localStorage.setItem('guiaFrecCur',cur)}catch(e){}
}
function go(i,manual){ i=Math.max(0,Math.min(N-1,i)); if(manual && live!==null && i!==live) follow=false; if(manual && i===live) follow=true; const ch=i!==cur; dir=i<cur?-1:1; cur=i; if(ch){render(true);scrollTo({top:0,behavior:'smooth'})} else {marcar();ui();} }
document.getElementById('prev').onclick=()=>go(cur-1,true);
document.getElementById('next').onclick=()=>go(cur+1,true);
document.getElementById('back').onclick=()=>{follow=true;go(live,false)};
let sx=0,sy=0; addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1),true)},{passive:true});
try{const s=+localStorage.getItem('guiaFrecCur');if(s>=0&&s<N)cur=s}catch(e){}
render(true);

/* ---- en vivo: solo se aceptan cambios firmados por el expositor ---- */
const st=document.getElementById('status'), stx=document.getElementById('statusTxt'), toast=document.getElementById('toast');
function setStatus(on,txt){st.classList.toggle('live',on);stx.textContent=txt}
const b64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
let lastT=0, lastMsg=0;
(async()=>{
  const C=window.VIVO;
  if(!C||!window.supabase||!C.SUPABASE_URL.startsWith('http')){setStatus(false,'Modo manual');return}
  let key; try{key=await crypto.subtle.importKey('jwk',C.CLAVE_PUBLICA,{name:'ECDSA',namedCurve:'P-256'},false,['verify'])}catch(e){setStatus(false,'Modo manual');return}
  const sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY,{realtime:{params:{eventsPerSecond:5}}});
  const ch=sb.channel(C.CANAL,{config:{broadcast:{self:false}}});
  ch.on('broadcast',{event:'lamina'},async({payload})=>{
    try{
      const {s,id,f,v,t,sig}=payload||{};
      if(!Number.isInteger(s)||typeof id!=='string'||!Number.isInteger(f)||typeof v!=='string'||typeof t!=='number'||t<=lastT||typeof sig!=='string')return;
      const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64u(sig),new TextEncoder().encode(s+'|'+id+'|'+f+'|'+v+'|'+t));
      if(!ok)return;
      // versión distinta: recargar una vez con la guía nueva
      if(v!==VER){ let n=0; try{n=+sessionStorage.getItem('guiaRecarga')||0}catch(e){} if(n<2){ try{sessionStorage.setItem('guiaRecarga',n+1)}catch(e){} location.replace(location.pathname+'?v='+encodeURIComponent(v)); return; } }
      let i=L.findIndex(x=>x.id===id); if(i<0) i=s-1; if(i<0||i>=N) return;
      lastT=t; lastMsg=Date.now(); const changed=live!==i; live=i; liveF=f;
      setStatus(true,'En vivo');
      if(follow && i!==cur){ go(i,false); toast.textContent='Lámina '+(i+1); toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'),1600); try{navigator.vibrate&&navigator.vibrate(30)}catch(e){} }
      else { marcar(); if(changed) ui(); }
    }catch(e){}
  }).subscribe(state=>{ if(state==='SUBSCRIBED') setStatus(false,'Esperando'); else if(state!=='JOINING') setStatus(false,'Modo manual'); });
  setInterval(()=>{ if(lastMsg && Date.now()-lastMsg>15000) setStatus(false,'Sin señal') },5000);
})();
</script>
